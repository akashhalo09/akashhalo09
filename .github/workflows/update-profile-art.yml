name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/fetch_contributions.py
      - scripts/render_heatmap_svg.py
      - scripts/render_stats_svg.py
      - scripts/svgkit.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the scrape + render deps; the portrait libraries are local-only.
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - run: python scripts/fetch_contributions.py
        env:
          GH_USER: ${{ github.repository_owner }}
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/render_stats_svg.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh contribution graph and stats [skip ci]"
            git push
          fi

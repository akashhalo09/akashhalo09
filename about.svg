<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="660" viewBox="0 0 1720 660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<style>.n{animation:on .5s ease-out both}@keyframes on{from{stroke:#30363d}}.d{animation:core .5s ease-out both}@keyframes core{from{opacity:0}}.l{animation:label .5s ease-out both}@keyframes label{from{fill:#7d8590}}.p{animation:fill 3.6s linear 0.6s both}@keyframes fill{from{stroke-dashoffset:1260}}.t{animation:in .45s ease-out both}@keyframes in{from{opacity:0;transform:translateY(14px)}}@media (prefers-reduced-motion:reduce){.n,.d,.l,.p,.t{animation:none}.pulse{display:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
<rect width="1720" height="660" rx="12" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1719" height="659" rx="12" fill="none" stroke="#30363d"/>
<line x1="0" y1="30" x2="1720" y2="30" stroke="#30363d"/>
<circle cx="20" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="52" cy="15" r="5" fill="#27c93f"/>
<text x="860.0" y="19" fill="#7d8590" font-size="12" text-anchor="middle">akash@github: ~$ ./about.sh</text>
<defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.4" fill="#7d8590" fill-opacity=".45"/></pattern><linearGradient id="edges"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="fade"><rect width="1720" height="660" fill="url(#edges)"/></mask><linearGradient id="trail"><stop offset="0" stop-color="#aff5b4" stop-opacity="0"/><stop offset="1" stop-color="#aff5b4"/></linearGradient><clipPath id="rail"><rect x="230" y="296" width="1260" height="8"/></clipPath></defs>
<text x="48" y="110" font-size="40" font-weight="700" fill="#e6edf3">Lead product engineer at Halo Funding.</text>
<text x="48" y="160" font-size="26" fill="#c9d1d9">I lead engineering and own product, take designs from Figma to code myself,</text>
<text x="48" y="196" font-size="26" fill="#c9d1d9">and ship AI features to production.</text>
<rect x="0" y="224" width="1720" height="200" fill="url(#dots)" mask="url(#fade)"/>
<line x1="230" y1="300" x2="1490" y2="300" stroke="#30363d" stroke-width="3"/>
<line class="p" x1="230" y1="300" x2="1490" y2="300" stroke="#26a641" stroke-width="3" stroke-dasharray="1260"/>
<circle class="d" style="animation-delay:0.60s" cx="230.0" cy="300" r="30" fill="#39d353" fill-opacity=".22" filter="url(#glow)"/>
<circle cx="230.0" cy="300" r="13" fill="#161b22" stroke="#39d353" stroke-width="3" class="n" style="animation-delay:0.60s"/><circle cx="230.0" cy="300" r="5" fill="#39d353" class="d" style="animation-delay:0.60s"/>
<g text-anchor="middle"><text x="230.0" y="264" font-size="20" fill="#7d8590">2023 – 24</text><text class="l" style="animation-delay:0.60s" x="230.0" y="354" font-size="24" font-weight="600" fill="#e6edf3">Legitt AI</text><text x="230.0" y="384" font-size="20" fill="#7d8590">Full Stack Product Engineer</text></g>
<circle class="d" style="animation-delay:1.80s" cx="650.0" cy="300" r="30" fill="#39d353" fill-opacity=".22" filter="url(#glow)"/>
<circle cx="650.0" cy="300" r="13" fill="#161b22" stroke="#39d353" stroke-width="3" class="n" style="animation-delay:1.80s"/><circle cx="650.0" cy="300" r="5" fill="#39d353" class="d" style="animation-delay:1.80s"/>
<g text-anchor="middle"><text x="650.0" y="264" font-size="20" fill="#7d8590">2024 – 25</text><text class="l" style="animation-delay:1.80s" x="650.0" y="354" font-size="24" font-weight="600" fill="#e6edf3">Palisades Security</text><text x="650.0" y="384" font-size="20" fill="#7d8590">Founding Engineer</text></g>
<circle class="d" style="animation-delay:3.00s" cx="1070.0" cy="300" r="30" fill="#39d353" fill-opacity=".22" filter="url(#glow)"/>
<circle cx="1070.0" cy="300" r="13" fill="#161b22" stroke="#39d353" stroke-width="3" class="n" style="animation-delay:3.00s"/><circle cx="1070.0" cy="300" r="5" fill="#39d353" class="d" style="animation-delay:3.00s"/>
<g text-anchor="middle"><text x="1070.0" y="264" font-size="20" fill="#7d8590">2025</text><text class="l" style="animation-delay:3.00s" x="1070.0" y="354" font-size="24" font-weight="600" fill="#e6edf3">Layup Labs</text><text x="1070.0" y="384" font-size="20" fill="#7d8590">Founding Design Engineer</text></g>
<circle class="d" style="animation-delay:4.20s" cx="1490.0" cy="300" r="30" fill="#39d353" fill-opacity=".22" filter="url(#glow)"/>
<circle cx="1490.0" cy="300" r="13" fill="#161b22" stroke="#39d353" stroke-width="3" class="n" style="animation-delay:4.20s"/><circle cx="1490.0" cy="300" r="5" fill="#39d353" class="d" style="animation-delay:4.20s"/>
<g text-anchor="middle"><text x="1490.0" y="264" font-size="20" fill="#7d8590">2025 – now</text><text class="l" style="animation-delay:4.20s" x="1490.0" y="354" font-size="24" font-weight="600" fill="#e6edf3">Halo Funding</text><text x="1490.0" y="384" font-size="20" fill="#7d8590">Lead Product Engineer</text></g>
<rect class="pulse" y="298" width="220" height="4" fill="url(#trail)" clip-path="url(#rail)" opacity="0"><animate attributeName="x" values="10;1270;1270" keyTimes="0;0.5;1" begin="0.6s" dur="7.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.48;0.5;1" begin="0.6s" dur="7.2s" repeatCount="indefinite"/></rect>
<circle class="pulse" cy="300" r="7" fill="#aff5b4" filter="url(#glow)" opacity="0"><animate attributeName="cx" values="230;1490;1490" keyTimes="0;0.5;1" begin="0.6s" dur="7.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.48;0.5;1" begin="0.6s" dur="7.2s" repeatCount="indefinite"/></circle>
<g class="t" style="animation-delay:0.10s" font-size="26"><text x="48" y="470" fill="#26a641">focus</text><text x="198" y="470" fill="#c9d1d9">0-to-1 products, design to code with no handoff, AI features</text></g>
<g class="t" style="animation-delay:0.19s" font-size="26"><text x="48" y="516" fill="#26a641">stack</text><text x="198" y="516" fill="#c9d1d9">Next.js, React, TypeScript, Node.js, FastAPI, PostgreSQL, AWS</text></g>
<g class="t" style="animation-delay:0.28s" font-size="26"><text x="48" y="562" fill="#26a641">ai</text><text x="198" y="562" fill="#c9d1d9">Anthropic and OpenAI models</text></g>
<g class="t" style="animation-delay:0.37s" font-size="26"><text x="48" y="608" fill="#26a641">side</text><text x="198" y="608" fill="#c9d1d9">Notchie, a little helper that lives in your Mac's notch</text></g>
</svg>
